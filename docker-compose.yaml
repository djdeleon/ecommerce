services:
  reverse-proxy:
    image: nginx:alpine
    container_name: eco_nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend-api:/var/www/html

  cache:
    image: redis:8-alpine
    container_name: eco_redis
    command: redis-server --appendonly yes

  async-events:
    image: rabbitmq:4.2-management-alpine
    container_name: eco_rabbitmq
    ports:
      - "15672:15672"

  database:
    image: postgres:18-alpine
    container_name: eco_postgres
    environment:
      - POSTGRES_USER=eco_user
      - POSTGRES_PASSWORD=eco_password
      - POSTGRES_DB=ecommerce
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data

  database-gui:
    image: dpage/pgadmin4
    container_name: eco_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@ecommerce.local
      PGADMIN_DEFAULT_PASSWORD: admin_password
      PGADMIN_CONFIG_ALLOW_SPECIAL_EMAIL_DOMAINS: "['local']"
    ports:
      - "8080:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  backend-api:
    build: ./backend-api
    container_name: eco_laravel
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./backend-api:/var/www/html
    working_dir: /var/www/html

  frontend-ui:
    build: ./frontend-ui
    container_name: eco_nuxt
    user: "${UID:-1000}:${GID:-1000}"
    volumes:
      - ./frontend-ui:/app
      - /app/node_modules
      - /app/node_modules/.cache
    ports:
      - "3000:3000"
    environment:
      - HOST=0.0.0.0
      - PORT=3000

volumes:
  pgadmin_data: 
  postgres_data: 