server {
    listen 80;
    server_name localhost;
    root /var/www/html/public; # points to Laravel's public entry directory

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    index index.php;
    charset utf-8;

    # api request directly to laravel's entry point
    location /api {
        include fastcgi_params;
        fastcgi_pass backend-api:9000;
        
        # Point directly to Laravel's public/index.php inside the backend container
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param QUERY_STRING $query_string;
    }

    # Fallback for any other explicit .php file requests
    location ~ \.php$ {
        fastcgi_pass backend-api:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }

    # Routes Standard API requests
    location / {
        proxy_pass http://frontend-ui:3000;
        proxy_http_version 1.1;

        # required for nuxt/vite hmr websockets
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # standard proxy headers for accurate request tracking
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Prevents Nginx from killing the websocket socket during development idle phases
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Prevents serving static files via PHP
    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    error_page 404 /index.php;
    
    location ~ /\.(?!well-known|cache).* {
        deny all;
    }
}